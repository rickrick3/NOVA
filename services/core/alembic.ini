# Used by the alembic command line only (for example `uv run alembic revision -m "..."`).
# The application runs migrations through nova_core.kernel.migrate, which passes the
# database URL itself; from the command line, migrations/env.py reads it from the settings.
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
